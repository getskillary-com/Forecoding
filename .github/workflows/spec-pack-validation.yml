name: Spec Pack Validation

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  spec-pack-fixtures:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Smoke validator CLI
        run: node scripts/validate-generated-scaffold.mjs --help

      - name: Validate spec-pack fixtures
        run: npm run validate:fixtures
