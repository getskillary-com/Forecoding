name: Platform Validation

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  platform-baseline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Drift checks
        run: npm run check:drift

      - name: Build
        run: npm run build

      - name: Smoke admin API (unauthenticated)
        run: npm run smoke:admin-api:local -- --timeout-ms 120000

      - name: Smoke workspace tasks API (unauthenticated)
        run: npm run smoke:workspace-tasks-api -- --timeout-ms 120000

      - name: Smoke admin API (authenticated, optional)
        if: ${{ secrets.ADMIN_SMOKE_COOKIE != '' }}
        env:
          ADMIN_SMOKE_COOKIE: ${{ secrets.ADMIN_SMOKE_COOKIE }}
        run: npm run smoke:admin-api:local -- --timeout-ms 120000

      - name: Smoke validator CLI
        run: node scripts/validate-generated-scaffold.mjs --help

      - name: Validate spec-pack fixtures
        run: npm run validate:fixtures
