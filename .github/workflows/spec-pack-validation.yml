name: Platform Validation

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  platform-baseline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Drift checks
        run: npm run check:drift

      - name: Evaluate SSE contract fixtures
        run: npm run check:evaluate-sse-contract

      - name: Runtime preflight gate (CI baseline env)
        env:
          APP_BASE_URL: https://ci.example.com
          AUTH_SESSION_COOKIE_NAME: __session
          AUTH_CODE_SECRET: ci-auth-secret
          EMAIL_SERVER: smtp://user:pass@smtp.example.com:587
          EMAIL_FROM: no-reply@example.com
          FIREBASE_PROJECT_ID: ci-firebase-project
          FIREBASE_CLIENT_EMAIL: ci-service-account@example.iam.gserviceaccount.com
          FIREBASE_PRIVATE_KEY: ci-private-key
          STRIPE_SECRET_KEY: sk_test_ci
          STRIPE_WEBHOOK_SECRET: whsec_ci
          AI_PROVIDER: openai
          OPENAI_API_KEY: sk-ci-openai
          FORECODING_ADMIN_EMAILS: admin@example.com
        run: npm run gate:runtime-preflight

      - name: Build
        run: npm run build

      - name: Smoke generate API (unauthenticated)
        run: npm run smoke:generate-api -- --timeout-ms 120000

      - name: Smoke evaluate SSE API
        run: npm run smoke:evaluate-sse-api -- --timeout-ms 120000 --stream-timeout-ms 45000

      - name: Smoke admin API (unauthenticated)
        run: npm run smoke:admin-api:local -- --timeout-ms 120000

      - name: Smoke workspace tasks API (unauthenticated)
        run: npm run smoke:workspace-tasks-api -- --timeout-ms 120000

      - name: Smoke validator CLI
        run: node scripts/validate-generated-scaffold.mjs --help

      - name: Validate spec-pack fixtures
        run: npm run validate:fixtures
