env:
  - variable: APP_BASE_URL
    value: "https://forecoding.com"
    availability:
      - RUNTIME
  - variable: FIREBASE_PROJECT_ID
    secret: FIREBASE_PROJECT_ID
    availability:
      - RUNTIME
  - variable: FIREBASE_CLIENT_EMAIL
    secret: FIREBASE_CLIENT_EMAIL
    availability:
      - RUNTIME
  - variable: FIREBASE_PRIVATE_KEY
    secret: FIREBASE_PRIVATE_KEY
    availability:
      - RUNTIME
  - variable: AUTH_SESSION_COOKIE_NAME
    value: "__session"
    availability:
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: NEXT_PUBLIC_FIREBASE_API_KEY
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    secret: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    secret: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    secret: NEXT_PUBLIC_FIREBASE_APP_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    secret: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME
  - variable: AI_PROVIDER
    value: "gemini"
    availability:
      - RUNTIME
  - variable: OPENAI_API_KEY
    secret: OPENAI_API_KEY
    availability:
      - RUNTIME
  - variable: OPENAI_MODEL
    value: "gpt-5.2-pro"
    availability:
      - RUNTIME
  - variable: DEEPSEEK_API_KEY
    secret: DEEPSEEK_API_KEY
    availability:
      - RUNTIME
  - variable: DEEPSEEK_MODEL
    value: "deepseek-chat"
    availability:
      - RUNTIME
  - variable: EMAIL_SERVER
    secret: EMAIL_SERVER
    availability:
      - RUNTIME
  - variable: EMAIL_FROM
    secret: EMAIL_FROM
    availability:
      - RUNTIME
  - variable: STRIPE_SECRET_KEY
    secret: STRIPE_SECRET_KEY
    availability:
      - RUNTIME
  - variable: STRIPE_WEBHOOK_SECRET
    secret: STRIPE_WEBHOOK_SECRET
    availability:
      - RUNTIME
  - variable: STRIPE_PAYMENTS_PAUSED
    value: "0"
    availability:
      - RUNTIME
  - variable: STRIPE_UNIT_AMOUNT_CENTS
    value: "799"
    availability:
      - RUNTIME
  - variable: STRIPE_MAX_UNIT_AMOUNT_CENTS
    value: "1499"
    availability:
      - RUNTIME
  - variable: STRIPE_DYNAMIC_PRICING_ENABLED
    value: "1"
    availability:
      - RUNTIME
  - variable: STRIPE_CURRENCY
    value: "usd"
    availability:
      - RUNTIME
  - variable: FORECODING_ADMIN_EMAILS
    secret: FORECODING_ADMIN_EMAILS
    availability:
      - RUNTIME



runConfig:
  minInstances: 0
  maxInstances: 5
  concurrency: 80
  cpu: 1
  memoryMiB: 512
  vpcAccess:
    egress: PRIVATE_RANGES_ONLY
    networkInterfaces:
      - network: default
        subnetwork: default
