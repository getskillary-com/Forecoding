env:
  - variable: DATABASE_URL
    secret: DATABASE_URL
    availability:
      - RUNTIME
  - variable: NEXTAUTH_URL
    value: "https://forecoding.com"
    availability:
      - RUNTIME
  - variable: NEXTAUTH_SECRET
    secret: NEXTAUTH_SECRET
    availability:
      - RUNTIME
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME
  - variable: EMAIL_SERVER
    secret: EMAIL_SERVER
    availability:
      - RUNTIME
  - variable: EMAIL_FROM
    secret: EMAIL_FROM
    availability:
      - RUNTIME
  - variable: NEXTAUTH_DEV_BYPASS
    value: "0"
    availability:
      - RUNTIME
  - variable: NEXT_PUBLIC_DEV_AUTH_BYPASS
    value: "0"
    availability:
      - RUNTIME
  - variable: STRIPE_SECRET_KEY
    secret: STRIPE_SECRET_KEY
    availability:
      - RUNTIME
  - variable: STRIPE_WEBHOOK_SECRET
    secret: STRIPE_WEBHOOK_SECRET
    availability:
      - RUNTIME
  - variable: STRIPE_UNIT_AMOUNT_CENTS
    value: "499"
    availability:
      - RUNTIME
  - variable: STRIPE_CURRENCY
    value: "usd"
    availability:
      - RUNTIME



runConfig:
  minInstances: 0
  maxInstances: 5
  concurrency: 80
  cpu: 1
  memoryMiB: 512
  vpcAccess:
    egress: PRIVATE_RANGES_ONLY
    networkInterfaces:
      - network: default
        subnetwork: default
